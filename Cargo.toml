[package]
name = "ther"
version = "0.1.0"
edition = "2024"

[features]
default = ["jira"]
# Each module ships its own Dioxus screen + domain logic, selected at build time.
jira = []

[dependencies]
# Dioxus UI framework (for web and desktop)
dioxus = { version = "0.7.0", features = ["desktop"] }

# Async runtime for pipeline execution
tokio = { version = "1.38", features = ["full"] }

# Data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio capture from microphone
cpal = "0.15"

# Local speech-to-text (whisper.cpp bindings)
whisper-rs = "0.14"

# Embedded LLM (candle, quantized GGUF) + model fetch/tokenizer
candle-core = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
tokenizers = "0.21"
hf-hub = "0.4"
anyhow = "1"

# Atlassian MCP client (streamable HTTP over reqwest) + Basic-auth encoding
reqwest = { version = "0.12", features = ["json", "stream"] }
base64 = "0.22"
futures-util = "0.3"
regex = "1"
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

